<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIME SCENE | Store</title>
  <meta name="description" content="Shop official Crime Scene streetwear. Hoodies, t-shirts, caps and exclusive drops.">
  <meta property="og:title" content="CRIME SCENE | Store">
  <meta property="og:description" content="Shop official Crime Scene streetwear. Leave Evidence.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>

<body>

    <!-- HERO -->

    <section class="shop-hero">

        <div class="shop-content">

            <h1>CRIME SCENE STORE</h1>

            <p>
                Leave Evidence Everywhere
            </p>

        </div>

    </section>

    <!-- NAVIGATION -->

    <section class="shop-nav">

        <button onclick="filterProducts('all')">
            ALL
        </button>

        <button onclick="filterProducts('tshirt')">
            T-SHIRTS
        </button>

        <button onclick="filterProducts('hoodie')">
            HOODIES
        </button>

        <button onclick="filterProducts('cap')">
            CAPS
        </button>

        <button onclick="filterProducts('pants')">
            PANTS
        </button>

        <button onclick="filterProducts('other')">
            OTHER
        </button>

    </section>

    <!-- FEATURED -->

    <section class="upcoming-products" id="upcoming">

    <div class="overlay">
        <h1>Upcoming Products</h1>
        <p>New drops coming soon.</p>
    </div>

</section>

    <!-- PRODUCTS -->

    <section class="products-container"
             id="products-container">

    </section>
  <!-- ═══════════════════════════ CTA ═════════════════════════════ -->
  <section class="cta-section">
    <h2>LEAVE YOUR MARK</h2>
    <p>Every piece tells a story. Every fit leaves evidence.</p>
    <a href="index.html" class="cta-btn">BACK TO HOME</a>
  </section>

  <!-- ═══════════════════════════ FOOTER ══════════════════════════ -->
  <footer class="footer">
    <div class="socials">
               <a href="https://www.instagram.com/crimedrip?igsh=eDRuYWk0MGx1YnZj"
                target="_blank"
                rel="noopener noreferrer">

                <img src="assets/images/instagram.jpeg"
                    alt="Instagram">

            </a>

            <a href="https://www.tiktok.com/@crimescene1441?_r=1&_t=ZS-95OgPBga3Vc"
                target="_blank"
                rel="noopener noreferrer">

                <img src="assets/images/tiktok.png"
                    alt="TikTok">

            </a>

            <a href="https://youtube.com/@crimescenelifestyle?si=PqlXC4V3-9mZd_7v"
                target="_blank"
                rel="noopener noreferrer">

                <img src="assets/images/youtube.png"
                    alt="YouTube">

            </a>

<a href="https://www.facebook.com/profile.php?id=61587080947589"
                target="_blank"
                rel="noopener noreferrer">

                <img src="assets/images/facebook.png"
                    alt="Facebook">

            </a>

            <a href="https://whatsapp.com/channel/0029VbCSSCiEquiRIJZGGv15"
                target="_blank"
                rel="noopener noreferrer">

                <img src="assets/images/whatsapp.png"
                    alt="WhatsApp">

            </a>
    </div>
    <p>© 2026 CRIME SCENE. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- ═══════════════════════════ CART TRIGGER ════════════════════ -->
  <button class="cart-trigger" onclick="toggleCart()" aria-label="Open cart">
    🛒 <span id="cart-count">0</span>
  </button>

  <!-- ═══════════════════════════ CART PANEL ══════════════════════ -->
  <aside class="cart-panel" id="cart" role="dialog" aria-label="Shopping cart">
    <div class="cart-panel__head">
      <h2 class="cart-panel__title">YOUR CART</h2>
      <button class="cart-panel__close" onclick="toggleCart()" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-panel__items" id="cart-items"></div>
    <div class="cart-panel__foot">
      <div class="cart-panel__total" id="cart-total"></div>
      <button class="cart-panel__checkout" onclick="checkoutWhatsApp()">ORDER ON WHATSAPP</button>
    </div>
  </aside>

  <script src="js/product.js"></script>

</body>
</html>
