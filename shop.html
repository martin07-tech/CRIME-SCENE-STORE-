<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CRIME SCENE | Store</title>

    <meta name="description"
          content="Shop official Crime Scene streetwear. Hoodies, t-shirts, caps and exclusive drops.">

    <meta name="theme-color"
          content="#0a0a0a">

    <link rel="icon"
          type="image/png"
          href="assets/images/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet"
          href="css/shop.css">

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Montserrat:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- HEADER -->

    <header class="store-header">
    <div class="logo">
        <a href="index.html">CRIME SCENE</a>
    </div>

    <nav>
        <a href="index.html">HOME</a>
        <a href="shop.html" class="active">STORE</a>
    </nav>
</header>

    <!-- HERO -->

    <section class="shop-hero">

        <div class="shop-content">

            <h1>CRIME SCENE STORE</h1>

            <p>
                Leave Evidence Everywhere.
            </p>

            <a href="#products-container"
               class="shop-btn">

                SHOP NOW

            </a>

        </div>

    </section>

    <!-- FILTERS -->

    <section class="shop-nav">

        <button class="active"
                onclick="filterProducts('all')">
            ALL
        </button>

        <button onclick="filterProducts('tshirt')">
            T-SHIRTS
        </button>

        <button onclick="filterProducts('hoodie')">
            HOODIES
        </button>

        <button onclick="filterProducts('cap')">
            CAPS
        </button>

        <button onclick="filterProducts('pants')">
            PANTS
        </button>

        <button onclick="filterProducts('other')">
            OTHER
        </button>

    </section>

    <!-- FEATURED DROP -->

    <section class="featured-drop">

        <img
            src="assets/images/products/IMG-20260512-WA0043.jpg"
            alt="Crime Scene Upcoming Drop"
            loading="lazy">

        <div class="featured-text">

            <h2>UPCOMING DROP</h2>

            <p>
                More evidence loading...
            </p>

        </div>

    </section>

    <!-- PRODUCTS -->

    <main>

        <section class="products-container"
                 id="products-container">

            <!-- Products inserted by JS -->

        </section>

    </main>

    <!-- CART ICON -->

    <div class="cart-icon"
         onclick="toggleCart()">

        🛒

        <span id="cart-count">
            0
        </span>

    </div>

    <!-- CART -->

    <aside class="cart"
           id="cart">

        <div class="cart-header">

            <h2>YOUR CART</h2>

            <button class="close-cart"
                    onclick="toggleCart()">
                ✕
            </button>

        </div>

        <div id="cart-items">

        </div>

        <div class="cart-footer">

            <button onclick="checkoutWhatsApp()">

                ORDER ON WHATSAPP

            </button>

        </div>

    </aside>

    <!-- FOOTER -->

    <footer class="store-footer">

        <p>
            © 2026 CRIME SCENE.
            ALL RIGHTS RESERVED.
        </p>

    </footer>

    <!-- JS -->

    <script src="js/product.js"></script>

</body>

</html>
