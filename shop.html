<<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRIME SCENE | Store</title>
  <meta name="description" content="Shop official Crime Scene streetwear. Hoodies, t-shirts, caps and exclusive drops.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/shop.css">
</head>

<body>

  <!-- ===================== HEADER ===================== -->
  <header class="site-header">
    <a class="site-logo" href="index.html">CRIME SCENE</a>
    <nav class="site-nav">
      <a href="index.html">HOME</a>
      <a href="shop.html" class="active">STORE</a>
    </nav>
  </header>

  <!-- ===================== HERO ===================== -->
  <section class="hero">
    <div class="hero__inner">
      <h1 class="hero__title">CRIME SCENE STORE</h1>
      <p class="hero__sub">Leave Evidence Everywhere.</p>
      <a href="#products" class="hero__btn">SHOP NOW</a>
    </div>
  </section>

  <!-- ===================== FILTERS ===================== -->
  <nav class="filters" aria-label="Product filters">
    <button class="filter-btn active" onclick="filterProducts('all')">ALL</button>
    <button class="filter-btn" onclick="filterProducts('tshirt')">T-SHIRTS</button>
    <button class="filter-btn" onclick="filterProducts('hoodie')">HOODIES</button>
    <button class="filter-btn" onclick="filterProducts('cap')">CAPS</button>
    <button class="filter-btn" onclick="filterProducts('pants')">PANTS</button>
    <button class="filter-btn" onclick="filterProducts('other')">OTHER</button>
  </nav>

  <!-- ===================== FEATURED DROP ===================== -->
  <section class="featured">
    <img class="featured__img" src="assets/images/products/IMG-20260512-WA0043.jpg" alt="Crime Scene Upcoming Drop" loading="lazy">
    <div class="featured__overlay">
      <span class="featured__label">NEW</span>
      <h2 class="featured__title">UPCOMING DROP</h2>
      <p class="featured__sub">More evidence loading…</p>
    </div>
  </section>

  <!-- ===================== PRODUCTS ===================== -->
  <main>
    <section class="products" id="products">
      <!-- Injected by product.js -->
    </section>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="site-footer">
    <p>© 2026 CRIME SCENE. ALL RIGHTS RESERVED.</p>
  </footer>

  <!-- ===================== CART TRIGGER ===================== -->
  <button class="cart-trigger" onclick="toggleCart()" aria-label="Open cart">
    🛒 <span id="cart-count">0</span>
  </button>

  <!-- ===================== CART PANEL ===================== -->
  <aside class="cart-panel" id="cart" role="dialog" aria-label="Shopping cart">
    <div class="cart-panel__head">
      <h2 class="cart-panel__title">YOUR CART</h2>
      <button class="cart-panel__close" onclick="toggleCart()" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-panel__items" id="cart-items"></div>
    <div class="cart-panel__foot">
      <div class="cart-panel__total" id="cart-total"></div>
      <button class="cart-panel__checkout" onclick="checkoutWhatsApp()">ORDER ON WHATSAPP</button>
    </div>
  </aside>

  <script src="js/product.js"></script>

</body>
</html>
